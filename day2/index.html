<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicknotes</title>
  </head>
  <body>
    <header>
      <h1>Quicknotes</h1>
      <p>Capture ideas before they disappear.</p>

      <nav class="nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="noteForm">
          <label for="note-input">New note:</label>
          <input type="text" id="note-input" placeholder="Type a note..." />
          <button type="submit">Add Note</button>
        </form>
      </section>

      <section>
        <h2>Your Notes</h2>
        <p id="note-count">You have 2 notes.</p>
        <ul id="notes-list">
          <li>Revise HTML forms</li>
          <li>push my code to GitHub</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Quicknotes. Built during web foundations.</p>
    </footer>
  </body>
</html>
